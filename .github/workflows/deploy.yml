name: Full DevOps CI/CD Pipeline

on:
  push:
    branches: ["main"]

env:
  BACKEND_IMAGE: madhul423/django
  FRONTEND_IMAGE: madhul423/nginx

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

    # 📥 Checkout
    - name: Checkout Code
      uses: actions/checkout@v4

    # 🐳 Docker Login
    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 🏗️ Build Backend
    - name: Build Backend Image
      run: |
        docker build -t $BACKEND_IMAGE:${{ github.sha }} .

    # 📤 Push Backend
    - name: Push Backend Image
      run: |
        docker push $BACKEND_IMAGE:${{ github.sha }}

    # 🏗️ Build Nginx
    - name: Build Nginx Image
      run: |
        docker build -t $FRONTEND_IMAGE:${{ github.sha }} ./nginx

    # 📤 Push Nginx
    - name: Push Nginx Image
      run: |
        docker push $FRONTEND_IMAGE:${{ github.sha }}

    # ⚙️ Setup Terraform
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    # 🌍 Terraform Init & Apply
    - name: Terraform Apply
      run: |
        cd terraform
        terraform init
        terraform apply -auto-approve
      env:
         AWS_ACCESS_KEY_ID: ${{secrets.AWS_ACCESS_KEY_ID}}  
         AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    # ⚙️ Install Ansible
    # - name: Install Ansible
    #   run: |
    #     pip install ansible
    #     ansible-galaxy collection install community.kubernetes
    - name: Get Server IP
      id: tf_output
      working-directory: terraform
      run: |
        echo "ip=$(terraform output -raw public_ip)" >> $GITHUB_OUTPUT

    # 14 Setup SSH
    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/python-pair.pem
        chmod 600 ~/.ssh/python-pair.pem

    - name: Install Ansible
      run: |
         pip install ansible
         ansible-galaxy collection install community.kubernetes

    # 16 Add EC2 to known hosts
    - name: Add EC2 to known hosts
      run: |
        ssh-keyscan -H ${{ steps.tf_output.outputs.ip }} >> ~/.ssh/known_hosts

    # ⚙️ Setup kubectl
    - name: Setup kubectl
      uses: azure/setup-kubectl@v4

    # ⚙️ Setup Helm
    - name: Setup Helm
      uses: azure/setup-helm@v4

    # 🔐 Setup kubeconfig
    - name: Configure Kubeconfig
      run: |
        echo "${{ secrets.KUBECONFIG }}" > kubeconfig
        export KUBECONFIG=$PWD/kubeconfig

    # 🚀 Deploy using Ansible + Helm
    - name: Deploy App
      run: |
          ANSIBLE_HOST_KEY_CHECKING=False ansible-playbook \
          -i "${{ steps.tf_output.outputs.ip }}," \
          --private-key ~/.ssh/python-pair.pem \
          ansible/deploy.yml \
          --extra-vars "image_repo=$BACKEND_IMAGE image_tag=${{ github.sha }} frontend_repo=$FRONTEND_IMAGE frontend_tag=${{ github.sha }}"