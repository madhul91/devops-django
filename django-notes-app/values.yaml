# Default values for django-notes-app.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# ── Replica counts per service ─────────────────────────────────────────────
replicaCount:
  django: 1
  nginx: 1

# ── Container images ───────────────────────────────────────────────────────
django:
  image:
    repository: madhul423/django
    tag: "latest"
    pullPolicy: IfNotPresent
  port: 8000

env:
  DB_NAME: test_db
  DB_USER: root
  DB_PASSWORD: root
  DB_PORT: "3306"
  DB_HOST: mysql

nginx:
  image:
    repository: madhul423/nginx
    tag: "latest"
    pullPolicy: IfNotPresent
  port: 80
  service:
    type: NodePort
    nodePort: 30007

# MySQL is deployed as a StatefulSet with persistent storage
mysql:
  image:
    repository: mysql
    tag: "latest"
    pullPolicy: IfNotPresent
  port: 3306
  database: test_db
  # Root password is stored in a Kubernetes Secret.
  # Create it before deploying:
  #   kubectl create secret generic mysql-secret \
  #     --from-literal=root-password=<your-password>
  existingSecret: mysql-secret
  secretKey: root-password
  # Persistent storage for MySQL data
  persistence:
    enabled: true
    storageClassName: ""   # leave empty to use cluster default
    accessMode: ReadWriteOnce
    size: 5Gi

# ── Image pull secrets (for private registries) ────────────────────────────
imagePullSecrets: []

# ── Name overrides ─────────────────────────────────────────────────────────
nameOverride: ""
fullnameOverride: ""

# ── Service account ────────────────────────────────────────────────────────
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# ── Pod metadata ───────────────────────────────────────────────────────────
podAnnotations: {}
podLabels: {}

# ── Security contexts ──────────────────────────────────────────────────────
podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# ── Django service (ClusterIP — accessed internally via Nginx) ─────────────
service:
  type: ClusterIP
  port: 8000

# ── Ingress ────────────────────────────────────────────────────────────────
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
    # - secretName: chart-example-tls
    #   hosts:
    #     - chart-example.local

# ── Gateway API HTTPRoute ──────────────────────────────────────────────────
httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
  - name: gateway
    sectionName: http
  hostnames:
  - chart-example.local
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /

# ── Resource limits ────────────────────────────────────────────────────────
resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 512Mi
  # requests:
  #   cpu: 250m
  #   memory: 256Mi

# ── Liveness & readiness probes ────────────────────────────────────────────
# NOTE: Probes reference a named port. Make sure your Deployment template
# defines containerPort with name: http (for django) / name: nginx-http (for nginx).
livenessProbe:
  httpGet:
    path: /
    port: 8000   # use numeric port to avoid named-port resolution issues
  initialDelaySeconds: 15
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 10

# ── Autoscaling ────────────────────────────────────────────────────────────
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# ── Extra volumes & mounts ─────────────────────────────────────────────────
volumes: []
volumeMounts: []

# ── Scheduling ────────────────────────────────────────────────────────────
nodeSelector: {}
tolerations: []
affinity: {}